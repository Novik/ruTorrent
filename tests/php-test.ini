; The suite runs against these settings and no others: -c replaces the
; system php.ini, so a developer's local configuration cannot change what
; a test means.
zend.assertions = 1
error_reporting = -1
display_errors = 1

; A child served by TestHttpServer is given this file as its whole
; configuration, so the request body limits a test may rely on are the ones
; named here, not whatever the host happens to have. They are an install's
; limits rather than the suite's: the largest body a test posts through that
; server today is 619 bytes, and these numbers are stated so that a case
; about a torrent of a real size meets the limit an install has rather than a
; ceiling the suite never declared. 32 MiB of torrent is about 1.6 million
; piece hashes, which is tens of terabytes of payload at any piece size in
; use, and one post may carry a batch of such files. post_max_size stays
; above upload_max_filesize because PHP refuses the whole request on the post
; limit first, and the upload then reports no reason at all.
post_max_size = 64M
upload_max_filesize = 32M
