# Directories under the document root that must never be served.
#
# share/ holds the profile data: per-user settings, the .dat caches, the stored
# torrent files, and the tracker usernames and passwords the loginmgr plugin
# keeps. conf/ holds config.php, which carries the XMLRPC endpoint and whatever
# else the install has been told. tests/ is not part of a deployment at all.
#
# Apache installs get this from the .htaccess file already in each of those
# directories. nginx and lighttpd do not read .htaccess, so on those servers
# nothing stops a request for
#
#   /share/users/<user>/settings/loginmgr.dat
#
# from being answered with the file. Include this inside the server block that
# serves ruTorrent, or copy the location blocks into it.
#
# The regex form is used rather than three ^~ prefixes so that a single rule
# covers the directories however they are reached, and it is placed before the
# php location so it wins.

location ~ ^/(share|conf|tests)(/|$) {
	deny all;
	return 403;
}

# The same in lighttpd:
#
#   $HTTP["url"] =~ "^/(share|conf|tests)($|/)" {
#       url.access-deny = ("")
#   }
#
# Moving the profile directory out of the document root altogether is better
# than denying it, and is what $profilePath in conf/config.php is for. Point it
# at a directory the web server can read and write but does not serve, for
# example /var/lib/rutorrent, and the rules above stop mattering for share/.
