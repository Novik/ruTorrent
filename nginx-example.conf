# Keeping the profile data, the config and the tests out of what is served.
#
# share/ holds the profile data: per-user settings, the .dat caches, the stored
# torrent files, and the tracker usernames and passwords the loginmgr plugin
# keeps. conf/ holds config.php, which carries the XMLRPC endpoint and whatever
# else the install has been told. tests/ is not part of a deployment at all.
#
# Apache installs get this from the .htaccess file already in each of those
# directories. nginx and lighttpd do not read .htaccess, so on those servers
# nothing stops a request for
#
#   /share/users/<user>/settings/loginmgr.dat
#
# from being answered with the file.


# 1. Move the profile data out of the document root. This is the better answer,
#    and it is what $profilePath in conf/config.php is for. Point it at a
#    directory the web server can read and write but does not serve, for example
#
#      $profilePath = '/var/lib/rutorrent';
#
#    (or RU_PROFILE_PATH in the environment). Nothing below then has to be right
#    for the settings and the tracker credentials to be unreachable, and share/
#    under the document root stays empty.
#
#    conf/ and tests/ still live in the tree, so the rules below are still worth
#    having. conf/config.php is a php file, which is the case the deny rule is
#    most likely to lose -- see 3.


# 2. Deny the three directories. Write the rule for where ruTorrent is actually
#    served. Served at the root of the server:

location ~ ^/(share|conf|tests)(/|$) {
	deny all;
	return 403;
}

# Served under a prefix -- /rutorrent/, say -- the anchored form above matches
# nothing at all, because the request is /rutorrent/share/..., and the profile
# data is served as if no rule had been written. Name the prefix:
#
#   location ~ ^/rutorrent/(share|conf|tests)(/|$) {
#       deny all;
#       return 403;
#   }
#
# The same in lighttpd, at the root and under a prefix:
#
#   $HTTP["url"] =~ "^/(share|conf|tests)($|/)" {
#       url.access-deny = ("")
#   }
#
#   $HTTP["url"] =~ "^/rutorrent/(share|conf|tests)($|/)" {
#       url.access-deny = ("")
#   }


# 3. Put it before the php handler. nginx tries regex locations in the order
#    they appear and takes the first that matches, so a
#
#      location ~ \.php$ { ... }
#
#    written earlier wins for every path ending in .php -- conf/config.php among
#    them, which is then handed to the interpreter rather than denied. Whether
#    this file is included or its location block copied, it has to come before
#    that handler in the server block, not after it.
#
#    A prefix location written as
#
#      location ^~ /share/ { deny all; return 403; }
#
#    wins regardless of order: when a ^~ prefix is the longest prefix matching
#    the request, nginx stops and never tries the regex locations. It is the
#    sturdier form when the ordering is hard to be sure of -- one block per
#    directory, and each one still has to name the prefix the install is served
#    under.
