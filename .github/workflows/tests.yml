name: tests

on:
  push:
    branches: [ master ]
  pull_request:

jobs:
  php:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['7.4', '8.1', '8.5']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: posix, dom, xml, mbstring, iconv, json, curl
      - name: PHP test suite
        run: bash php-test.sh
        working-directory: tests

  php-32bit:
    # PHP_INT_MAX is 2^31 - 1 on a 32-bit build, so a length past 2 GiB is
    # read as a float; the 64-bit runners above never take that path.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PHP test suite on 32-bit PHP
        working-directory: tests
        run: |
          # pcntl, which setup-php provides on the 64-bit runners.
          printf 'FROM i386/php:7.4-cli\nRUN docker-php-ext-install pcntl\n' | docker build -q -t php32 -
          # The runner's default seccomp profile refuses a 32-bit process's
          # socket calls, and the HTTP fixtures listen on loopback.
          docker run --rm --security-opt seccomp=unconfined --user "$(id -u)" -v "$PWD/..:/w" -w /w/tests php32 bash php-test.sh

  jest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: tests/package-lock.json
      - run: npm ci
        working-directory: tests
      - run: npm test
        working-directory: tests
